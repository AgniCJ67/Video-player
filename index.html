
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Media Player</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root[data-theme="dark"] {
            --bg-gradient: linear-gradient(-45deg, #0f1115, #1a1d24, #0d1b2a, #16102b);
            --surface-glass: rgba(26, 29, 36, 0.7);
            --surface-hover: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-muted: #9ca3af;
            --accent: #3b82f6;
            --border-color: rgba(255, 255, 255, 0.1);
            --glow: 0 10px 40px rgba(59, 130, 246, 0.2);
            --vibrant-glow: drop-shadow(0 0 12px rgba(59, 130, 246, 0.9));
        }

        :root[data-theme="light"] {
            --bg-gradient: linear-gradient(-45deg, #f3f4f6, #e5e7eb, #dbeafe, #f3e8ff);
            --surface-glass: rgba(255, 255, 255, 0.7);
            --surface-hover: rgba(0, 0, 0, 0.05);
            --text-primary: #111827;
            --text-muted: #4b5563;
            --accent: #2563eb;
            --border-color: rgba(0, 0, 0, 0.1);
            --glow: 0 10px 40px rgba(37, 99, 235, 0.15);
            --vibrant-glow: drop-shadow(0 0 12px rgba(37, 99, 235, 0.8));
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; color: var(--text-primary); display: flex; height: 100dvh; overflow: hidden; background: #0f1115; }

        /* Background & Glass Effects */
        .app-background { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bg-gradient); background-size: 400% 400%; animation: gradientBG 15s ease infinite; z-index: -1; }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .glass-panel { background: var(--surface-glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--border-color); }

        /* Sidebar & Headers */
        .sidebar { width: 260px; display: flex; flex-direction: column; padding: 20px; border-right: 1px solid var(--border-color); z-index: 10; }
        .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 40px; }
        .brand svg { width: 32px; height: 32px; }
        .brand h2 { font-size: 20px; font-weight: 700; background: linear-gradient(90deg, #3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-menu { display: flex; flex-direction: column; gap: 10px; }
        .nav-btn { display: flex; flex-direction: row; align-items: center; gap: 12px; background: transparent; border: none; color: var(--text-primary); font-size: 15px; font-weight: 500; padding: 12px 15px; border-radius: 8px; cursor: pointer; transition: background 0.3s; white-space: nowrap; }
        .nav-btn svg { width: 20px; height: 20px; fill: var(--text-muted); flex-shrink: 0; }
        .nav-btn:hover { background: var(--surface-hover); }

        .main-wrapper { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .top-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 5; }
        .search-bar { display: flex; align-items: center; background: var(--surface-hover); padding: 8px 15px; border-radius: 20px; width: 300px; gap: 10px; }
        .search-bar svg { width: 18px; height: 18px; fill: var(--text-muted); }
        .search-bar input { background: transparent; border: none; color: var(--text-primary); outline: none; width: 100%; font-family: inherit; }
        .user-profile { display: flex; align-items: center; gap: 15px; }
        .greeting { font-size: 14px; font-weight: 500; color: var(--text-muted); }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(45deg, var(--accent), #8b5cf6); display: flex; justify-content: center; align-items: center; font-weight: 600; color: #fff; }

        .content-grid { display: grid; grid-template-columns: 1fr; gap: 20px; padding: 20px 30px; align-items: start; }
        .player-column { display: flex; flex-direction: column; gap: 20px; }

        /* --- VIDEO CONTAINER --- */
        .video-container { 
            position: relative; width: 100%; background: #000; min-height: 400px; 
            border-radius: 12px; overflow: hidden; box-shadow: var(--glow); 
            display: block; line-height: 0; 
        }
        .video-container video { width: 100%; max-height: 70vh; object-fit: contain; display: block; }
        video::-webkit-media-controls { display: none !important; } 

        /* Empty State */
        .empty-state-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 5; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px); color: #fff; text-align: center; padding: 20px; }
        .empty-state-overlay svg { width: 64px; height: 64px; fill: var(--accent); margin-bottom: 15px; filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.5)); }
        .empty-state-overlay h3 { font-size: 22px; font-weight: 600; line-height: 1.2; margin-bottom: 8px; }
        .empty-state-overlay p { font-size: 14px; line-height: 1.2; color: #aaa; margin-bottom: 20px; max-width: 300px; }
        .primary-btn { background: var(--accent); color: #fff; border: none; padding: 10px 24px; border-radius: 20px; font-weight: 600; cursor: pointer; transition: background 0.3s; display: inline-block; line-height: 1.2;}

        /* Center Play Button */
        .center-play-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 64px; height: 64px; background: rgba(59, 130, 246, 0.85); border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 15; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .center-play-btn svg { width: 36px; height: 36px; fill: #fff; margin-left: 4px; }
        .video-container.paused:not(.no-media) .center-play-btn { opacity: 1; pointer-events: all; }

        /* --- CONTROLS TOOLBAR --- */
        .bottom-controls { 
            position: absolute; bottom: 0; left: 0; right: 0; 
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.7) 50%, transparent 100%); 
            padding: 30px 20px 20px; display: flex; flex-direction: column; gap: 15px; 
            z-index: 20; opacity: 1; transition: opacity 0.3s ease; 
        }
        .video-container.no-media .bottom-controls { display: none !important; }
        .video-container.idle .bottom-controls { opacity: 0; pointer-events: none; }

        /* Progress Bar */
        .progress-wrapper { position: relative; width: 100%; height: 8px; background: rgba(255, 255, 255, 0.3); border-radius: 4px; transition: height 0.2s; }
        .progress-wrapper:hover { height: 12px; }
        .progress-fill { 
            position: absolute; top: 0; left: 0; height: 100%; 
            background: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899); 
            border-radius: 4px; width: 0%; pointer-events: none; 
        }
        .progress-fill::after { 
            content: ''; position: absolute; right: -9px; top: 50%; transform: translateY(-50%); 
            width: 18px; height: 18px; background: #fff; border-radius: 50%; 
            box-shadow: 0 0 10px rgba(236, 72, 153, 0.8); 
        }
        #progressSlider { position: absolute; top: -10px; left: 0; width: 100%; height: 30px; opacity: 0; cursor: pointer; margin: 0; z-index: 2; -webkit-appearance: none; }

        /* Toolbar Layout */
        .controls-toolbar { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 18px; }

        .icon-btn { 
            background: none; border: none; padding: 0; color: #fff; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; 
            width: 32px; height: 32px; 
            flex-shrink: 0; transition: all 0.2s ease; 
        }
        .icon-btn:hover { color: var(--accent); filter: var(--vibrant-glow); transform: scale(1.1); }
        .icon-btn svg { width: 100%; height: 100%; fill: currentColor; }

        .pulse-btn {
            width: 44px; height: 44px; 
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 50%;
            color: #fff;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.6);
        }
        .pulse-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.9);
        }
        .pulse-btn svg { width: 24px; height: 24px; }

        .volume-group { display: flex; align-items: center; gap: 10px; }
        .volume-slider { width: 80px; -webkit-appearance: none; height: 6px; background: rgba(255,255,255,0.4); border-radius: 3px; outline: none; cursor: pointer; }
        .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: #fff; border-radius: 50%; box-shadow: 0 0 8px rgba(0,0,0,0.5); }

        .time-display { font-size: 14px; font-weight: 600; color: #fff; line-height: 1; margin-left: 5px; white-space: nowrap; }
        .text-btn { font-size: 15px; font-weight: 700; background: rgba(255, 255, 255, 0.2); border: none; color: #fff; padding: 6px 14px; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
        .text-btn:hover { background: rgba(255, 255, 255, 0.3); }

        /* Popups inside Toolbar */
        .popup-menu { position: relative; }
        .popup-options { position: absolute; bottom: 100%; right: 0; margin-bottom: 15px; background: rgba(20, 20, 20, 0.95); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; flex-direction: column; display: none; min-width: 90px; z-index: 30; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .popup-options.active { display: flex; }
        .popup-option { padding: 12px; cursor: pointer; font-size: 14px; font-weight: 600; text-align: center; color: #fff; line-height: 1;}
        .popup-option.active { color: var(--accent); background: rgba(59, 130, 246, 0.2); }

        /* --- ACTION BUTTONS & PANELS --- */
        .video-info { padding: 20px; border-radius: 12px; transition: opacity 0.3s; }
        .video-info h1 { font-size: 22px; margin-bottom: 10px; font-weight: 600; line-height: 1.2;}
        .video-meta { display: flex; justify-content: space-between; align-items: center; color: var(--text-muted); font-size: 14px; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
        .action-buttons { display: flex; flex-direction: row; gap: 10px; }
        .action-btn { 
            background: var(--surface-hover); color: var(--text-primary); border: none; 
            padding: 8px 16px; border-radius: 20px; font-weight: 500; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; gap: 8px; 
            transition: all 0.2s ease;
        }
        .action-btn:hover { background: var(--accent); color: #fff; }
        .action-btn svg { width: 18px; height: 18px; fill: currentColor; display: block; flex-shrink: 0; }

        .playlist-column { padding: 20px; border-radius: 12px; height: fit-content; }
        .playlist-column h3 { font-size: 16px; margin-bottom: 15px; line-height: 1.2;}
        .playlist-items { display: flex; flex-direction: column; gap: 12px; }
        .playlist-item { display: flex; gap: 12px; padding: 8px; border-radius: 8px; cursor: pointer; transition: background 0.3s; }
        .playlist-item.active { background: rgba(59, 130, 246, 0.1); border-left: 3px solid var(--accent); }
        .thumb { width: 100px; height: 56px; border-radius: 6px; display: flex; justify-content: center; align-items: center; color: #fff; font-size: 20px; box-shadow: inset 0 0 20px rgba(0,0,0,0.2); }
        .info h4 { font-size: 14px; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 150px; line-height: 1.2;}
        .info p { font-size: 12px; color: var(--text-muted); line-height: 1.2;}

        /* Modals */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; z-index: 1000; transition: opacity 0.3s ease; }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-content { border-radius: 12px; width: 90%; max-width: 400px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid var(--border-color); }
        .close-btn { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }
        .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .setting-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 8px; color: var(--text-muted); }
        .styled-select { width: 100%; padding: 10px; border-radius: 6px; background: transparent; color: var(--text-primary); border: 1px solid var(--border-color); outline: none; }
        .slider.full-width { width: 100%; background: var(--border-color); height: 6px; -webkit-appearance: none; border-radius: 3px; }
        .slider.full-width::-webkit-slider-thumb { background: var(--accent); width: 16px; height: 16px; -webkit-appearance: none; border-radius: 50%; }
        .reset-btn { background: var(--surface-hover); color: var(--text-primary); border: 1px solid var(--border-color); padding: 10px; border-radius: 6px; font-weight: 500; margin-top: 10px; cursor: pointer; }

        /* Responsive Mobile Layout */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; flex-direction: row; align-items: center; justify-content: space-between; padding: 10px 20px; border-right: none; border-bottom: 1px solid var(--border-color); }
            .nav-menu { flex-direction: row; align-items: center; }
            .nav-btn span, .nav-btn text { display: none; } 
            .top-header { display: none; } 
            
            .video-container { border-radius: 0; min-height: 250px; }
            .toolbar-left, .toolbar-right { gap: 10px; }
            
            .icon-btn { width: 28px; height: 28px; }
            .pulse-btn { width: 38px; height: 38px; }
            .volume-group { display: none; } 
            .time-display { font-size: 12px; }
        }

        @media (max-width: 450px) {
            .toolbar-left, .toolbar-right { gap: 8px !important; }
            .icon-btn { width: 24px !important; height: 24px !important; }
            .pulse-btn { width: 34px !important; height: 34px !important; }
            .time-display { font-size: 11px !important; }
            .text-btn { font-size: 12px !important; padding: 4px 8px !important; }
        }
    </style>
</head>
<body>
    <div class="app-background"></div>

    <aside class="sidebar glass-panel">
        <div class="brand">
            <svg viewBox="0 0 24 24" fill="var(--accent)"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
            <h2>ProPlayer</h2>
        </div>

        <nav class="nav-menu">
            <input type="file" id="appVideoUpload" accept="video/*" style="opacity: 0; position: absolute; z-index: -1; width: 1px; height: 1px;">
            <label for="appVideoUpload" class="nav-btn" id="appImportBtn">
                <svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>
                Import Video
            </label>
            <button class="nav-btn" id="appSettingsBtn">
                <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
                Settings
            </button>
        </nav>
    </aside>

    <div class="main-wrapper">
        <header class="top-header glass-panel">
            <div class="search-bar">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" placeholder="Search for media...">
            </div>
            <div class="user-profile">
                <span class="greeting">Welcome back, User</span>
                <div class="avatar">U</div>
            </div>
        </header>

        <div class="content-grid">
            <div class="player-column">
                
                <div class="video-container no-media paused glow-effect" id="videoContainer">
                    
                    <div class="empty-state-overlay" id="emptyState">
                        <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                        <h3>No Media Loaded</h3>
                        <p>Select a video from your device to begin playback.</p>
                        <label for="appVideoUpload" class="action-btn primary-btn mt-10">Import File</label>
                    </div>

                    <div class="center-play-btn" id="centerPlayBtn">
                        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </div>

                    <video id="video" playsinline></video>

                    <div class="bottom-controls" id="bottomControls">
                        <div class="progress-wrapper">
                            <input type="range" id="progressSlider" min="0" max="100" value="0" step="0.1">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>

                        <div class="controls-toolbar">
                            <div class="toolbar-left">
                                <button class="icon-btn" id="rewindBtn" title="Rewind 10s">
                                    <svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
                                </button>
                                
                                <button class="icon-btn pulse-btn" id="playPauseBtn" title="Play/Pause">
                                    <svg class="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                    <svg class="pause-icon" style="display: none;" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                                </button>
                                
                                <button class="icon-btn" id="forwardBtn" title="Forward 10s">
                                    <svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
                                </button>

                                <div class="volume-group">
                                    <button class="icon-btn" id="muteBtn">
                                        <svg class="volume-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                                        <svg class="mute-icon" style="display: none;" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
                                    </button>
                                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1">
                                </div>
                                
                                <span class="time-display"><span id="currentTime">0:00</span> / <span id="duration">0:00</span></span>
                            </div>

                            <div class="toolbar-right">
                                <div class="popup-menu">
                                    <button class="text-btn" id="speedBtn">1x</button>
                                    <div class="popup-options" id="speedOptions">
                                        <div class="popup-option" data-speed="0.5">0.5x</div>
                                        <div class="popup-option active" data-speed="1">1x</div>
                                        <div class="popup-option" data-speed="1.5">1.5x</div>
                                        <div class="popup-option" data-speed="2">2x</div>
                                    </div>
                                </div>
                                <button class="icon-btn" id="fullscreenBtn" title="Fullscreen">
                                    <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="video-info glass-panel" id="videoInfoPanel" style="opacity: 0.5; pointer-events: none;">
                    <h1 id="videoTitleDisplay">Awaiting Import...</h1>
                    <div class="video-meta">
                        <span id="videoStatus">Local File • Ready to play</span>
                        <div class="action-buttons">
                            <button class="action-btn"><svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg> Like</button>
                            <button class="action-btn"><svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/></svg> Share</button>
                        </div>
                    </div>
                </div>
            </div>

            <aside class="playlist-column glass-panel">
                <h3>Up Next</h3>
                <div class="playlist-items">
                    <div class="playlist-item active" id="currentPlaylistItem">
                        <div class="thumb" style="background: var(--surface-hover); display: flex; align-items: center; justify-content: center; font-size: 24px; color: var(--text-muted);">
                            <svg viewBox="0 0 24 24" style="width: 28px; height: 28px; fill: currentColor;"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8 12.5v-9l6 4.5-6 4.5z"/></svg>
                        </div>
                        <div class="info">
                            <h4 id="playlistTitle">No Media</h4>
                            <p>Waiting for file</p>
                        </div>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <h3>App Settings</h3>
                <button class="close-btn" id="closeSettings">&times;</button>
            </div>
            <div class="modal-body">
                <div class="setting-group">
                    <label>App Theme</label>
                    <select id="themeSelect" class="styled-select">
                        <option value="dark">Dark Mode</option>
                        <option value="light">Light Mode</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label>Video Brightness (<span id="brightVal">100</span>%)</label>
                    <input type="range" class="slider full-width" id="brightSlider" min="50" max="150" value="100">
                </div>
                <div class="setting-group">
                    <label>Contrast (<span id="contrastVal">100</span>%)</label>
                    <input type="range" class="slider full-width" id="contrastSlider" min="50" max="150" value="100">
                </div>
                <div class="setting-group">
                    <label>Saturation (<span id="satVal">100</span>%)</label>
                    <input type="range" class="slider full-width" id="satSlider" min="0" max="200" value="100">
                </div>
                <button class="reset-btn" id="resetSettingsBtn">Reset to Default</button>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const videoContainer = document.getElementById('videoContainer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const centerPlayBtn = document.getElementById('centerPlayBtn');
        const rewindBtn = document.getElementById('rewindBtn');
        const forwardBtn = document.getElementById('forwardBtn');
        const playIcon = document.querySelector('.play-icon');
        const pauseIcon = document.querySelector('.pause-icon');

        const progressSlider = document.getElementById('progressSlider');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');

        const muteBtn = document.getElementById('muteBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeIcon = document.querySelector('.volume-icon');
        const muteIcon = document.querySelector('.mute-icon');
        const fullscreenBtn = document.getElementById('fullscreenBtn');

        const emptyState = document.getElementById('emptyState');
        const videoTitleDisplay = document.getElementById('videoTitleDisplay');
        const videoInfoPanel = document.getElementById('videoInfoPanel');
        const playlistTitle = document.getElementById('playlistTitle');
        const currentPlaylistItem = document.getElementById('currentPlaylistItem');
        const speedBtn = document.getElementById('speedBtn');
        const speedOptions = document.getElementById('speedOptions');

        const appImportBtn = document.getElementById('appImportBtn');
        const appVideoUpload = document.getElementById('appVideoUpload');
        const appSettingsBtn = document.getElementById('appSettingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const closeSettings = document.getElementById('closeSettings');
        const themeSelect = document.getElementById('themeSelect');

        const brightSlider = document.getElementById('brightSlider');
        const contrastSlider = document.getElementById('contrastSlider');
        const satSlider = document.getElementById('satSlider');
        const brightVal = document.getElementById('brightVal');
        const contrastVal = document.getElementById('contrastVal');
        const satVal = document.getElementById('satVal');
        const resetSettingsBtn = document.getElementById('resetSettingsBtn');

        let isScrubbing = false;
        let idleTimer;

        function resetIdleTimer() {
            videoContainer.classList.remove('idle');
            clearTimeout(idleTimer);
            if (!video.paused && !videoContainer.classList.contains('no-media')) {
                idleTimer = setTimeout(() => {
                    videoContainer.classList.add('idle');
                }, 3000); 
            }
        }

        ['mousemove', 'mousedown', 'touchstart', 'click', 'keydown'].forEach(evt => {
            videoContainer.addEventListener(evt, resetIdleTimer);
        });

        video.addEventListener('play', () => {
            videoContainer.classList.remove('paused');
            playIcon.style.display = 'none';
            pauseIcon.style.display = 'block';
            resetIdleTimer();
        });

        video.addEventListener('pause', () => {
            videoContainer.classList.add('paused');
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
            clearTimeout(idleTimer);
            videoContainer.classList.remove('idle'); 
        });

        function togglePlay(e) {
            if (!video.src || videoContainer.classList.contains('no-media')) return;
            if (video.paused) {
                video.play().catch(e => console.error(e));
            } else {
                video.pause();
            }
        }
        playPauseBtn.addEventListener('click', togglePlay);
        centerPlayBtn.addEventListener('click', togglePlay);
        video.addEventListener('click', togglePlay);

        rewindBtn.addEventListener('click', () => { video.currentTime = Math.max(0, video.currentTime - 10); });
        forwardBtn.addEventListener('click', () => { video.currentTime = Math.min(video.duration, video.currentTime + 10); });

        function formatTime(time) {
            if (isNaN(time)) return "0:00";
            const min = Math.floor(time / 60);
            const sec = Math.floor(time % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        video.addEventListener('loadedmetadata', () => { durationEl.textContent = formatTime(video.duration); });

        video.addEventListener('timeupdate', () => {
            if (!isScrubbing) {
                const percent = (video.currentTime / video.duration) * 100;
                progressFill.style.width = `${percent}%`;
                progressSlider.value = percent;
                currentTimeEl.textContent = formatTime(video.currentTime);
            }
        });

        progressSlider.addEventListener('input', (e) => {
            if (videoContainer.classList.contains('no-media')) return;
            isScrubbing = true;
            const percent = e.target.value;
            progressFill.style.width = `${percent}%`;
            currentTimeEl.textContent = formatTime((percent / 100) * video.duration);
        });

        progressSlider.addEventListener('change', (e) => {
            if (videoContainer.classList.contains('no-media')) return;
            video.currentTime = (e.target.value / 100) * video.duration;
            isScrubbing = false;
        });

        volumeSlider.addEventListener('input', (e) => {
            video.volume = e.target.value;
            video.muted = e.target.value === "0";
            volumeIcon.style.display = video.muted ? 'none' : 'block';
            muteIcon.style.display = video.muted ? 'block' : 'none';
        });
        muteBtn.addEventListener('click', () => {
            video.muted = !video.muted;
            volumeSlider.value = video.muted ? 0 : video.volume;
            volumeIcon.style.display = video.muted ? 'none' : 'block';
            muteIcon.style.display = video.muted ? 'block' : 'none';
        });

        function closePopups() { speedOptions.classList.remove('active'); }
        speedBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isActive = speedOptions.classList.contains('active');
            closePopups();
            if (!isActive) speedOptions.classList.add('active');
        });

        document.querySelectorAll('#speedOptions .popup-option').forEach(opt => {
            opt.addEventListener('click', (e) => {
                e.stopPropagation();
                video.playbackRate = opt.dataset.speed;
                speedBtn.textContent = `${opt.dataset.speed}x`;
                document.querySelector('#speedOptions .active').classList.remove('active');
                opt.classList.add('active');
                closePopups();
            });
        });
        document.addEventListener('click', closePopups);

        fullscreenBtn.addEventListener('click', () => {
            if (videoContainer.classList.contains('no-media')) return;
            if (!document.fullscreenElement) {
                if (videoContainer.requestFullscreen) videoContainer.requestFullscreen();
                else if (videoContainer.webkitRequestFullscreen) videoContainer.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        });

        appVideoUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                video.controls = false; 
                
                const fileURL = URL.createObjectURL(file);
                video.src = fileURL;
                video.load(); 
                
                videoContainer.classList.remove('no-media');
                if (emptyState) { emptyState.style.display = 'none'; }
                
                videoInfoPanel.style.opacity = '1';
                videoInfoPanel.style.pointerEvents = 'auto';
                
                const fileName = file.name.replace(/\.[^/.]+$/, "");
                videoTitleDisplay.textContent = fileName;
                playlistTitle.textContent = fileName;
                
                progressFill.style.width = `0%`;
                progressSlider.value = 0;
                
                video.play().catch(err => console.error("Playback Error:", err));
                e.target.value = ''; 
            }
        });

        appSettingsBtn.addEventListener('click', () => settingsModal.classList.add('active'));
        closeSettings.addEventListener('click', () => settingsModal.classList.remove('active'));
        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) settingsModal.classList.remove('active');
        });

        themeSelect.addEventListener('change', (e) => {
            document.documentElement.setAttribute('data-theme', e.target.value);
        });

        function applyFilters() {
            brightVal.textContent = brightSlider.value;
            contrastVal.textContent = contrastSlider.value;
            satVal.textContent = satSlider.value;
            video.style.filter = `brightness(${brightSlider.value}%) contrast(${contrastSlider.value}%) saturate(${satSlider.value}%)`;
        }
        brightSlider.addEventListener('input', applyFilters);
        contrastSlider.addEventListener('input', applyFilters);
        satSlider.addEventListener('input', applyFilters);

        resetSettingsBtn.addEventListener('click', () => {
            brightSlider.value = 100;
            contrastSlider.value = 100;
            satSlider.value = 100;
            themeSelect.value = "dark";
            document.documentElement.setAttribute('data-theme', 'dark');
            applyFilters();
        });
    </script>
</body>
</html>
